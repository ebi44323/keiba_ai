<style>

  --fire:#c0392b; --fire-bg:#fbe9e7; --calm:#2f6fb0; --calm-bg:#e8f1fb;
  --warn:#b0791b; --warn-bg:#fbf1dc; --money:#1a7a4c; --money-bg:#e6f4ec;
  --bar:#c9d2de; --bar-hi:#7a1f3d;
  --shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141b; --card:#1b1e28; --ink:#e9ecf3; --muted:#99a2b2;
  --line:#2a2e3b; --line2:#232733; --accent:#e79bb2; --accent-soft:#33202a;
  --fire:#ff7a6b; --fire-bg:#3a2320; --calm:#7db4ec; --calm-bg:#1f2a38;
  --warn:#e3b25a; --warn-bg:#332a17; --money:#5cc88c; --money-bg:#182a20;
  --bar:#333a49; --bar-hi:#e79bb2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#12141b; --card:#1b1e28; --ink:#e9ecf3; --muted:#99a2b2;
  --line:#2a2e3b; --line2:#232733; --accent:#e79bb2; --accent-soft:#33202a;
  --fire:#ff7a6b; --fire-bg:#3a2320; --calm:#7db4ec; --calm-bg:#1f2a38;
  --warn:#e3b25a; --warn-bg:#332a17; --money:#5cc88c; --money-bg:#182a20;

<style>

 border:1px solid #bcd6bf;border-radius:10px;padding:8px 10px 6px;margin:8px 0;overflow:hidden}

 padding:0 4px;opacity:0;transition:opacity .25s}

@media (prefers-color-scheme:dark){
 .kbrs-pod{background:rgba(0,0,0,.34)}
 .kbrs-pod .rk{color:#bfe0bf}.kbrs-pod.p1 .rk{color:#e8c46a}
 .kbrs-pod .hn{color:#dcecdf}.kbrs-pod .od{color:#e8b77a}.kbrs-pay{color:#5cc88c}}
@media (prefers-color-scheme:dark){
 .kbrs{background:linear-gradient(180deg,#22322a,#1a2720 62%,#152019);border-color:#3a5240}
 .kbrs-hd,.kbrs-res{color:#a8cdad}.kbrs-nm{color:#bcd8c0}.kbrs-ft{color:#7e9a84}
 .kbrs-rem{color:#d6f0d9;background:rgba(0,0,0,.35)}
 .kbrs-btn{background:#2a3d30;color:#bfe0bf;border-color:#4c6a52}
 .kbrs-ord{background:#bfe0bf;color:#1a2720}}

<script>
(function(){
 if(window.__kbrsInit) return; window.__kbrsInit=1;
 var EASE=function(x){return 1-Math.pow(1-x,3);};

 // AI勝率を重みにした Plackett-Luce 抽選。1着の出現率が勝率どおりになる。
 function sampleOrder(ws){
  var idx=ws.map(function(_,i){return i;}), w=ws.slice(), out=[];
  while(idx.length){
   var s=0,i; for(i=0;i<idx.length;i++) s+=w[idx[i]];
   var r=Math.random()*s, a=0, pick=idx.length-1;
   for(i=0;i<idx.length;i++){a+=w[idx[i]]; if(r<=a){pick=i;break;}}
   out.push(idx[pick]); idx.splice(pick,1);
  }
  return out; // out[k] = k着の馬インデックス
 }

 function build(el){
  var hs=JSON.parse(el.getAttribute('data-h')||'[]');
  if(!hs.length){el.style.display='none';return null;}
  var dist=parseInt(el.getAttribute('data-dist')||'0',10)||1600;
  var lanes=hs.map(function(h){
   return '<div class="kbrs-lane"><div class="kbrs-h" style="left:6%">'
    +'<span class="kbrs-ord"></span>'
    +'<span class="kbrs-pill" style="background:'+h.c+'">'+h.no+'</span>'
    +'<span class="kbrs-nm">'+h.mk+h.nm+'</span></div></div>';
  }).join('');
  el.innerHTML='<div class="kbrs-hd"><span>🏇 レースシミュレーション</span>'
   +'<span class="kbrs-rem">残り'+dist+'m</span>'
   +'<span class="kbrs-btn">▶ 出走</span></div>'
   +'<div class="kbrs-track"><div class="kbrs-goal"></div>'+lanes+'</div>'
   +'<div class="kbrs-podium">'
   +'<div class="kbrs-pod p1"><span class="rk">1着</span><span class="bn"></span>'
   +'<span class="hn"></span><span class="od"></span></div>'
   +'<div class="kbrs-pod p2"><span class="rk">2着</span><span class="bn"></span>'
   +'<span class="hn"></span><span class="od"></span></div>'
   +'<div class="kbrs-pod p3"><span class="rk">3着</span><span class="bn"></span>'
   +'<span class="hn"></span><span class="od"></span></div></div>'
   +'<div class="kbrs-pay"></div>'
   +'<div class="kbrs-res"></div>'
   +'<div class="kbrs-ft">道中の位置は想定隊列（実測にもとづく）、着順は<b>AI勝率による抽選</b>です。'
   +'再生するたび結果が変わります＝それが確率予想の実際の姿です。</div>';
  var st={hs:hs,dist:dist,el:el,wins:{},runs:0,
   lanes:el.querySelectorAll('.kbrs-h'),ords:el.querySelectorAll('.kbrs-ord'),
   pods:el.querySelectorAll('.kbrs-pod'),pay:el.querySelector('.kbrs-pay'),
   rem:el.querySelector('.kbrs-rem'),res:el.querySelector('.kbrs-res'),
   btn:el.querySelector('.kbrs-btn')};
  st.btn.addEventListener('click',function(){play(st);});
  el.__st=st; return st;
 }

 function play(st){
  if(st.running) return; st.running=true; st.runs++;
  var hs=st.hs,n=hs.length,i,k;
  var order=sampleOrder(hs.map(function(h){return Math.max(h.w,0.001);}));
  var place=new Array(n); order.forEach(function(hi,kk){place[hi]=kk;});

  // ── 最終x: 前は詰まって後ろほど離れる（実際の入線＝ハナ差の叩き合い＋後方は大差）──
  var gaps=[0],acc=0;
  for(k=1;k<n;k++){ acc+=1.0+k*0.22; gaps.push(acc); }
  var scale=Math.min(58/Math.max(acc,1),1.6);
  var xf=hs.map(function(_,idx){return 94-gaps[place[idx]]*scale;});

  // ── 道中x: 想定隊列（e: 0=前）を 24〜80% に展開 ──
  var xm=hs.map(function(h){return 24+(1-h.e)*56;});

  // ── 直線の仕掛け: 後ろの馬ほど遅く動き出して鋭く伸びる（差し・追込の見せ場）──
  //    毎回わずかに乱数を混ぜるので、同じ着順でも運び方が変わる。
  var kick=hs.map(function(h){return 0.60+h.e*0.13+Math.random()*0.04;});
  var sharp=hs.map(function(h){return 1.7+h.e*1.5;});   // 後方馬ほど加速が鋭い

  st.ords.forEach(function(o){o.style.opacity=0;o.textContent='';});
  st.pods.forEach(function(p){p.classList.remove('show');});
  st.pay.classList.remove('show'); st.res.textContent='';
  var t0=null,DUR=8200;
  function frame(ts){
   if(t0===null)t0=ts;
   var p=Math.min((ts-t0)/DUR,1);
   st.rem.textContent='残り'+(Math.ceil(st.dist*(1-p)/50)*50)+'m';
   for(i=0;i<n;i++){
    var x;
    if(p<0.14){ x=6+(xm[i]-6)*EASE(p/0.14); }               // ゲート→隊列形成
    else if(p<kick[i]){                                      // 道中（息を入れる・小さな出入り）
     x=xm[i]+Math.sin((p-0.14)*9+i*1.7)*0.6;
    }else{                                                   // 直線: 仕掛けてから鋭く伸びる
     var q=(p-kick[i])/(1-kick[i]);
     q=Math.pow(q,1.0)*0.25+Math.pow(q,sharp[i])*0.75;       // 序盤ゆるく→末脚で一気に
     x=xm[i]+(xf[i]-xm[i])*q;
    }
    st.lanes[i].style.left=x+'%';
   }
   if(p<1){requestAnimationFrame(frame);}
   else{finish(st,order);}
  }
  requestAnimationFrame(frame);
 }

 function finish(st,order){
  var hs=st.hs,n=hs.length,k;
  for(k=0;k<Math.min(3,n);k++){
   var hi=order[k];
   st.ords[hi].textContent=(k+1)+'着'; st.ords[hi].style.opacity=1;
   var pod=st.pods[k],h=hs[hi];
   pod.querySelector('.bn').textContent=h.no;
   pod.querySelector('.bn').style.background=h.c;
   pod.querySelector('.hn').textContent=(h.mk?h.mk+' ':'')+h.nm;
   pod.querySelector('.od').textContent=(h.o>0?h.o.toFixed(1)+'倍':'—');
   (function(el,d){setTimeout(function(){el.classList.add('show');},d);})(pod,k*220);
  }
  for(k=n;k<3;k++){ if(st.pods[k]) st.pods[k].style.display='none'; }
  var w=hs[order[0]];
  if(w.o>0){
   st.pay.textContent='💰 単勝 '+Math.round(w.o*100).toLocaleString()+'円'

const CONF_ORDER={"勝負":0,"通常":1,"回避":2};
const fmtPct=x=>(x||0).toFixed(1)+"%";
let sort="venue", filter="all";
function topEV(rc){return rc.horses.length?Math.max.apply(null,rc.horses.map(h=>h.ev||0)):0;}
function maxWin(rc){return rc.horses.length?Math.max(1,Math.max.apply(null,rc.horses.map(h=>h.w||0))):1;}
function isDanger(rc,h){
  const top2=rc.horses.map(x=>x.w).sort((a,b)=>b-a).slice(0,2);
  return h.o<=4.0 && h.w<10 && top2.indexOf(h.w)<0;
}
function buildVenueChips(){
  const seen=[]; R.forEach(r=>{if(seen.indexOf(r.v)<0)seen.push(r.v);});
  const row=document.getElementById("filterRow"), cnt=document.getElementById("count");
  seen.forEach(v=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.dataset.filter=v;
    b.setAttribute("aria-pressed","false"); b.textContent=v;
    row.insertBefore(b,cnt);
  });
}
function buildSummary(){
  const el=document.getElementById("summary");
  const picks=[];
  R.forEach(rc=>rc.horses.forEach(h=>picks.push({rc:rc,mk:h.mk,nm:h.nm,ev:h.ev||0})));
  picks.sort((a,b)=>b.ev-a.ev);
  const top=picks.slice(0,5);
  const nFire=R.filter(r=>r.conf==="勝負").length, nAvoid=R.filter(r=>r.conf==="回避").length;
  el.innerHTML='<h2>🎯 本日のベスト <span class="s-counts">🔥勝負 '+nFire+' ・ ⚠️回避 '+nAvoid+' ・ 全'+R.length+'R</span></h2>'
    +'<div class="s-list">'+top.map(function(p){return '<div class="s-item"><span class="s-mk">'+(p.mk||'‥')+'</span>'
      +'<span class="s-rc">'+p.rc.v+p.rc.r+'R</span><span class="s-nm">'+p.nm+'</span>'
      +'<span class="s-ev num">EV '+p.ev.toFixed(2)+'</span></div>';}).join('')+'</div>';
}
function build(){
  const main=document.getElementById("main");
  main.innerHTML="";
  let list=R.slice();
  list=list.filter(function(rc){
    if(filter==="all")return true;
    if(filter==="勝負")return rc.conf==="勝負";
    if(filter==="ev")return topEV(rc)>=1.5;
    return rc.v===filter;
  });
  list.sort(function(a,b){
    if(sort==="venue")return a.v===b.v ? a.r-b.r : String(a.v).localeCompare(String(b.v),"ja");
    if(sort==="time")return String(a.t).localeCompare(String(b.t)) || a.r-b.r;
    if(sort==="conf")return CONF_ORDER[a.conf]-CONF_ORDER[b.conf] || String(a.t).localeCompare(String(b.t));
    if(sort==="ev")return topEV(b)-topEV(a);
    return 0;
  });
  document.getElementById("count").textContent=list.length+" レース";
  document.getElementById("empty").style.display=list.length?"none":"block";
  for(const rc of list){
    const mw=maxWin(rc);
    const card=document.createElement("article");
    card.className="card"; card.dataset.conf=rc.conf;
    const rows=rc.horses.map(function(h,i){
      const place=h.p, barW=Math.max(4,Math.min(100,h.w/mw*100));
      const evHot=h.ev>=1.5, danger=isDanger(rc,h);
      const tags=(h.ana?'<span class="tag d">🎯穴</span>':'')+(h.memo?'<span class="tag">📝メモ</span>':'');
      return '<div class="hrow '+(i>=5?'extra':'')+'">'
        +'<div class="mk">'+(h.mk||'<span style="visibility:hidden">•</span>')+'</div>'
        +'<div class="hmid"><div class="hname">'+h.nm+' '+tags+'</div>'
        +'<div class="sub"><span class="style">'+(h.st||'')+'・'+h.no+'番</span>'
        +'<span class="barwrap"><span class="bar" style="width:'+barW+'%"></span></span>'
        +'<span class="wr num">'+fmtPct(h.w)+'</span></div>'
        +'<div class="fukline num">複勝率 '+fmtPct(place)+(danger?' <span class="dchip">⚠️人気だがAI低評価</span>':'')+'</div></div>'
        +'<div class="hend"><div class="odds num">'+(h.o||0).toFixed(1)+'<small>倍</small></div>'
        +'<span class="evchip num '+(evHot?'hot':'')+'">EV '+(h.ev||0).toFixed(2)+'</span></div></div>';
    }).join("");
    const memoHtml=(rc.memos||[]).map(function(m){
      return '<div class="memoblock">📝 <span class="mh">'+m.nm+'</span> <span class="mt">'+m.tag+'・'+m.dt+'</span>'+(m.tx?('<br>'+m.tx):'')+'</div>';
    }).join("");
    const g=rc.gemini;
    const gemHtml=g?('<div class="gemini"><div class="gtitle">🤖 AI思考モード '+(g.model?('('+g.model+')'):'')+'</div>'
      +((g.h&&g.h.c)?('<div class="gcard"><b>🎯 本命党</b> '+g.h.c+(g.h.b?('<div class="gbet">💰 '+g.h.b+'</div>'):'')+'</div>'):'')
      +((g.a&&g.a.c)?('<div class="gcard"><b>💣 穴党</b> '+g.a.c+(g.a.b?('<div class="gbet">🎰 '+g.a.b+'</div>'):'')+'</div>'):'')
      +'</div>'):'';
    const extra=rc.horses.length>5;
    const distLine=(rc.track||'')+(rc.dist?rc.dist+'m':'');
    card.innerHTML=
      '<div class="chead"><span class="venue">'+rc.v+'</span><span class="rno num">'+rc.r+'R</span>'
      +(rc.gd?('<span class="gd" style="background:'+rc.gc+'">'+rc.gd+'</span>'):'')
      +'<span class="meta">'+(rc.t?('<span class="num">'+rc.t+'</span><span class="dot"></span>'):'')+'<span>'+distLine+'</span></span>'
      +'<span class="badge '+rc.conf+'">'+(rc.conf==="勝負"?"🔥 勝負":rc.conf==="回避"?"⚠️ 回避":"🟡 通常")+'</span></div>'
      +(rc.title?('<div class="rtitle">'+rc.title+'</div>'):'')
      +(rc.pace?('<div class="pace">'+rc.pace+'</div>'):'')
      +'<div class="hlist">'+rows+'</div>'
      +'<div class="cfoot">'
      +(extra?('<button class="toggle" type="button">＋ 全'+rc.horses.length+'頭を表示</button>'):'')
      +((rc.reason&&rc.reason!=='—')?('<div class="reason">🧠 <b>◎の根拠</b>：'+rc.reason+'</div>'):'')
      +memoHtml
      +fmHtml(rc)
      +rsnHtml(rc)
      +simHtml(rc)
      +'<div class="reco">💰 <b>買い目</b>：'+(rc.reco||'—')+'</div>'
      +gemHtml
      +'</div>';
    if(extra){
      const btn=card.querySelector(".toggle");
      btn.addEventListener("click",function(){
        card.classList.toggle("open");
        btn.textContent=card.classList.contains("open")?"− 上位のみ表示":("＋ 全"+rc.horses.length+"頭を表示");
      });
    }
    main.appendChild(card);
  }
  if(window.kbrsScan) window.kbrsScan();
}
function rsnHtml(rc){
  if(!rc.rsn||!rc.rsn.length) return "";
  return '<div class="rsnbox">'+rc.rsn.map(function(x){
    return '<div class="rsn '+(x.l||'')+'">'+x.e+' '+x.t+'</div>';
  }).join("")+'</div>';
}
function simHtml(rc){
  if(!rc.sim||!rc.sim.length) return "";
  return '<div class="simrow">'+rc.sim.map(function(b){
    return '<div class="simbet"><div class="bn">'+b.n+'</div><div class="bp">'+b.p+'%</div>'
      +'<div class="bt">'+b.pt+'点</div></div>';
  }).join("")+'</div>'
  +'<div class="simnote">◎軸・相手4頭で4000回シミュレーションした的中確率。'
  +'単勝の勝率から全着順を組み立てた推定です。</div>';
}
function fmHtml(rc){
  if(!rc.fm||!rc.fm.length) return "";
  // 属性はダブルクォートで囲み &,",<  を実体参照化（Python文字列内で ' を使うと消えて構文エラーになるため）
  return '<div class="kbrs" data-auto="0" data-dist="'+(rc.dist||1600)+'" data-h="'
    +JSON.stringify(rc.fm).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")+'"></div>';
}
function wireChips(rowId,set){
  document.getElementById(rowId).addEventListener("click",function(e){
    const b=e.target.closest(".chip"); if(!b)return;
    const chips=document.querySelectorAll("#"+rowId+" .chip");
    for(const c of chips)c.setAttribute("aria-pressed","false");
    b.setAttribute("aria-pressed","true"); set(b.dataset.sort||b.dataset.filter); build();
  });
}
wireChips("sortRow",function(v){sort=v;});
wireChips("filterRow",function(v){filter=v;});
document.getElementById("themebtn").addEventListener("click",function(){
  const r=document.documentElement, cur=r.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
});
buildVenueChips(); buildSummary(); build();
</script>
