name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. 過去の履歴をリセット
          rm -rf .git
          git init
          git branch -M main
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # 2. HF Spaceに不要な大容量ファイルを除外
          # （学習データ・trained_assets等はHF Hub Dataset側で管理するため不要）
          rm -f learning_data_perfect_tier.zip
          rm -f learning_data_perfect_tier.csv
          rm -f trained_assets.pkl
          rm -f keiba.log
          rm -rf back2/ backup/ __pycache__/ src/__pycache__/
          rm -f app_backup_before_refactor.py
          rm -f extract_structure.py fix_indent.py refactor_features.py refactor_split.py rewrite_app.py rewrite_app_phase2.py
          rm -f update_app_phase3.py update_phase3_core.py cloudflare_worker.js weekly.py wrangler.toml
          rm -f HANDOVER_*.md HF_TOKEN.txt
          rm -rf .claude/

          # 3. アプリコードだけをHFへ転送
          git add .
          git commit -m "Deploy from GitHub"
          git remote add hf https://ebi44323:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/ebi44323/keiba-ebye
          git push --force hf main
