name: Discord 週次成績レポート (月曜朝)

# ================================================================
# 毎週月曜 8:00 JST に先週（土日）の成績サマリーをDiscordに送信する。
# ai_daily_history.csv を HF Dataset から取得して集計する。
# app.py の振り返り実行時に自動保存されるCSVを使用。
#
# 【必要なGitHub Secrets】
#   HF_TOKEN                   - HuggingFace APIトークン（read権限）
#   HF_REPO_ID                 - 例: "username/keiba-ebye" (datasetリポジトリ)
#   DISCORD_REVIEW_WEBHOOK_URL - 振り返りチャンネルのWebhook URL
# ================================================================

on:
  schedule:
    # 日曜 17:00 JST = 日曜 8:00 UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      weeks_back:
        description: '何週前のレポートか (0=今週, 1=先週)'
        default: '0'

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python セットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: pip install requests huggingface_hub pandas --quiet

      - name: 週次レポート生成・送信
        env:
          HF_TOKEN:                  ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:                ${{ secrets.HF_REPO_ID }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          WEEKS_BACK:                ${{ github.event.inputs.weeks_back || '0' }}
        run: |
          python3 << 'PYEOF'
          import os, datetime, requests, io
          import pandas as pd
          from huggingface_hub import hf_hub_download

          HF_TOKEN    = os.environ.get("HF_TOKEN", "")
          HF_REPO_ID  = os.environ.get("HF_REPO_ID", "")
          WEBHOOK_URL = os.environ.get("DISCORD_REVIEW_WEBHOOK_URL", "")
          WEEKS_BACK  = int(os.environ.get("WEEKS_BACK", "0"))

          if not all([HF_TOKEN, HF_REPO_ID, WEBHOOK_URL]):
              print("必要な環境変数が未設定です。スキップ。")
              exit(0)

          # ── 対象週（土・日）の日付を計算 ──────────────────────
          JST = datetime.timezone(datetime.timedelta(hours=9))
          today_jst = datetime.datetime.now(JST).date()
          # 実行日が日曜なので today=日曜, yesterday=土曜
          last_sun = today_jst
          last_sat = today_jst - datetime.timedelta(days=1)
          if WEEKS_BACK > 0:
              last_sun -= datetime.timedelta(weeks=WEEKS_BACK)
              last_sat -= datetime.timedelta(weeks=WEEKS_BACK)

          target_dates = [last_sat.strftime('%Y/%m/%d'), last_sun.strftime('%Y/%m/%d')]
          print(f"集計対象: {target_dates}")

          # ── HF Dataset から ai_daily_history.csv を取得 ────────
          try:
              csv_path = hf_hub_download(
                  repo_id=HF_REPO_ID, filename="ai_daily_history.csv",
                  repo_type="dataset", token=HF_TOKEN,
                  cache_dir="/tmp/hf", force_download=True
              )
              df = pd.read_csv(csv_path)
          except Exception as e:
              print(f"CSVの取得に失敗: {e}")
              exit(0)

          # ── 対象週のデータを抽出 ──────────────────────────────
          df_week = df[df['日付'].isin(target_dates)].copy()
          if df_week.empty:
              print(f"対象週 ({target_dates}) のデータがCSVにありません。振り返りを先に実行してください。")
              # データなしでも「データ未取得」の通知は送る
              lines = [
                  f"📊 **keiba-ebye 週次レポート** | {last_sat.strftime('%m/%d')}〜{last_sun.strftime('%m/%d')}",
                  "",
                  "⚠️ 先週分のデータがありません。",
                  "振り返り画面で土日のレース集計を実行してください。",
                  "",
                  "-# keiba-ebye 週次レポート",
              ]
              requests.post(WEBHOOK_URL, json={"content": "\n".join(lines), "username": "keiba-ebye 📊"}, timeout=10)
              exit(0)

          # ── 集計 ──────────────────────────────────────────────
          def safe_get(col, df=df_week):
              return df[col].sum() if col in df.columns else 0

          total_races    = int(safe_get('本命レース数'))
          tan_hits       = int(safe_get('本命単勝的中数'))
          fuku_hits      = int(safe_get('本命複勝的中数'))
          ev_count       = int(safe_get('EV馬数'))
          ev_tan_hits    = int(safe_get('EV単勝的中数'))
          tan_return     = float(safe_get('本命単勝回収率')) / len(df_week) if len(df_week) > 0 else 0
          fuku_return    = float(safe_get('本命複勝回収率')) / len(df_week) if len(df_week) > 0 else 0
          ev_tan_return  = float(safe_get('穴馬単勝回収率')) / len(df_week) if len(df_week) > 0 else 0

          def emoji(v):
              if v >= 150: return "🔥"
              if v >= 100: return "✅"
              if v >= 70:  return "🟡"
              return "❌"

          # ── Discord メッセージ生成 ────────────────────────────
          date_str = f"{last_sat.strftime('%m/%d')}(土)〜{last_sun.strftime('%m/%d')}(日)"
          lines = [
              f"📊 **keiba-ebye 週次レポート** | {date_str}",
              f"集計対象: **{total_races}レース** ({', '.join([d[5:] for d in target_dates])})",
              "",
              "**【本命(◎) 成績】**",
              "```",
              f"単勝  {emoji(tan_return)} {tan_return:6.1f}%   的中 {tan_hits}/{total_races}R",
              f"複勝  {emoji(fuku_return)} {fuku_return:6.1f}%   的中 {fuku_hits}/{total_races}R",
              "```",
          ]
          if ev_count > 0:
              lines += [
                  "",
                  "**【期待値馬(EV1.5+) ベタ買い】**",
                  "```",
                  f"単勝  {emoji(ev_tan_return)} {ev_tan_return:6.1f}%   的中 {ev_tan_hits}/{ev_count}頭",
                  "```",
              ]
          lines += [
              "",
              "-# keiba-ebye 週次自動レポート (GitHub Actions)",
          ]

          content = "\n".join(lines)
          resp = requests.post(
              WEBHOOK_URL,
              json={"content": content, "username": "keiba-ebye 📊"},
              timeout=10
          )
          if resp.status_code in (200, 204):
              print(f"✅ 週次レポート送信完了")
          else:
              print(f"❌ 送信失敗 HTTP {resp.status_code}")
          PYEOF
