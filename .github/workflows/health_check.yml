name: 開催日ヘルスチェック → Discord 警告

# ================================================================
# 毎日 21:30 JST（UTC 12:30）に実行。その日の通知（振り返り18:00 / 日曜のまとめ）が
# 終わった後に、成績履歴 CSV に「実際に開催があった日」の行が書き込まれたかを検査する。
# 見当たらなければ Discord に警告 → 「数ヶ月無言で蓄積されない」事故の再発防止。
#
# ★2026-09-25: 日曜のみ → 毎日に変更。祝日の月曜開催・火曜開催の振り返りが
#   欠けても、旧実装（今週の土曜以降の行があるか）では検知できなかったため。
#   直近7日の開催日を netkeiba で調べて突き合わせる方式に変更した（正常時は無通知）。
#
# 【必要な GitHub Secrets】
#   HF_TOKEN                    - HuggingFace APIトークン（read権限）
#   HF_REPO_ID                 - 例: "yourname/keiba-ebye-models"
#   DISCORD_REVIEW_WEBHOOK_URL - 振り返りチャンネル Webhook（無ければ DISCORD_WEBHOOK_URL）
# ================================================================

on:
  schedule:
    # 毎日 21:30 JST = 12:30 UTC
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '何日前まで検査するか（既定7）'
        default: '7'

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージインストール
        run: |
          pip install --quiet \
            pandas==2.3.3 \
            requests==2.32.5 \
            pytz==2026.1 \
            huggingface_hub==1.7.2

      - name: ヘルスチェック実行
        env:
          HF_TOKEN:                   ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:                 ${{ secrets.HF_REPO_ID }}
          DISCORD_WEBHOOK_URL:        ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
        run: python health_check.py --days "${{ github.event.inputs.days || '7' }}"
