name: Retrain and Push Model

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '再学習の理由（任意）'
        required: false
        default: '手動トリガー'

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run retrain & push to HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ebi44323/keiba-ebye-models
        run: python train_and_push.py
