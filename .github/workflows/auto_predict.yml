name: 自動予想 → Discord 通知

# ================================================================
# 開催時間帯（JST 9:00〜16:45 ≒ UTC 0:00〜7:45）に15分ごとに実行し、
# 発走 5〜25 分前の「まだ投稿していない」レースを自動予想する。
#
# ★ 2026-09-25: ウィンドウを 10〜60分前 → 5〜25分前 に変更し、
#   HF Hub の投稿済みレジストリ(posted_races.json)で重複投稿を防ぐようにした。
#   旧実装はウィンドウ内のレースを毎回投稿していたため、15分ポーリングで
#   同じレースが3〜4回 Discord に流れていた（1レース1回・直前のオッズで投稿）。
#   幅20分 > ポーリング間隔15分 なので、cronがずれても取りこぼさない。
#
# ★ 2026-09-25: 土日のみ（'* * 0,6'）→ 毎日に変更。
#   祝日の月曜開催・火曜開催（例: 2026-09-21/22）で直前予想が一切飛ばなかったため。
#   無開催日は predict_auto.py が「本日の開催なし」で即終了する（通知なし・約1分で完了）。
#
# 【必要な GitHub Secrets】
#   HF_TOKEN        - HuggingFace APIトークン（read/write権限）
#   HF_REPO_ID      - 例: "yourname/keiba-ebye-models"
#   DISCORD_WEBHOOK_URL        - 直前予想チャンネルの Webhook URL
#   DISCORD_REVIEW_WEBHOOK_URL - 振り返りチャンネルの Webhook URL（省略可）
# ================================================================

on:
  schedule:
    # 毎日 UTC 0:00〜7:45（JST 9:00〜16:45）を 15分ごとにカバー
    # ウィンドウ幅50分 > ポーリング間隔15分 → 重複35分確保で全レース捕捉保証
    - cron: '0,15,30,45 0-7 * * *'
  workflow_dispatch:
    inputs:
      window_min:
        description: '予想対象: 発走まで最低何分前か'
        default: '5'
      window_max:
        description: '予想対象: 発走まで最大何分前か'
        default: '25'

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージインストール
        run: |
          pip install --quiet \
            lightgbm==4.6.0 \
            scikit-learn==1.8.0 \
            pandas==2.3.3 \
            numpy==2.4.2 \
            requests==2.32.5 \
            beautifulsoup4==4.14.3 \
            pytz==2026.1 \
            huggingface_hub==1.7.2 \
            joblib==1.5.3 \
            streamlit==1.60.0

      - name: 自動予想実行
        env:
          HF_TOKEN:                  ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:                ${{ secrets.HF_REPO_ID }}
          DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
        run: |
          WMIN=${{ github.event.inputs.window_min || '5' }}
          WMAX=${{ github.event.inputs.window_max || '25' }}
          python predict_auto.py --window-min $WMIN --window-max $WMAX
