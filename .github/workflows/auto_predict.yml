name: 自動予想 → Discord 通知

# ================================================================
# 土日の開催時間帯（JST 9:00〜16:30 ≒ UTC 0:00〜7:30）に
# 30分ごとに実行し、発走 15〜50 分前のレースを自動予想する。
#
# 【必要な GitHub Secrets】
#   HF_TOKEN        - HuggingFace APIトークン（read/write権限）
#   HF_REPO_ID      - 例: "yourname/keiba-ebye-models"
#   DISCORD_WEBHOOK_URL        - 直前予想チャンネルの Webhook URL
#   DISCORD_REVIEW_WEBHOOK_URL - 振り返りチャンネルの Webhook URL（省略可）
# ================================================================

on:
  schedule:
    # 土曜・日曜 UTC 0:00〜7:45（JST 9:00〜16:45）を 15分ごとにカバー
    # ウィンドウ幅50分 > ポーリング間隔15分 → 重複35分確保で全レース捕捉保証
    - cron: '0,15,30,45 0-7 * * 0,6'
  workflow_dispatch:
    inputs:
      window_min:
        description: '予想対象: 発走まで最低何分前か'
        default: '10'
      window_max:
        description: '予想対象: 発走まで最大何分前か'
        default: '60'

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージインストール
        run: |
          pip install --quiet \
            lightgbm==4.6.0 \
            scikit-learn==1.8.0 \
            pandas==2.3.3 \
            numpy==2.4.2 \
            requests==2.32.5 \
            beautifulsoup4==4.14.3 \
            pytz==2026.1 \
            huggingface_hub==1.7.2 \
            joblib==1.5.3 \
            streamlit==1.60.0

      - name: 自動予想実行
        env:
          HF_TOKEN:                  ${{ secrets.HF_TOKEN }}
          HF_REPO_ID:                ${{ secrets.HF_REPO_ID }}
          DISCORD_WEBHOOK_URL:       ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
        run: |
          WMIN=${{ github.event.inputs.window_min || '10' }}
          WMAX=${{ github.event.inputs.window_max || '60' }}
          python predict_auto.py --window-min $WMIN --window-max $WMAX
