name: keiba-ebye 週次データ更新

on:
  schedule:
    # 毎週月曜 AM6:00 JST (= UTC 21:00 日曜)
    - cron: '0 21 * * 1'  # 火曜06:00 JST(月曜21:00 UTC)
  workflow_dispatch:
    inputs:
      weeks_back:
        description: '何週分遡るか (デフォルト1)'
        required: false
        default: '1'
      fetch_all:
        description: '全未取得データ取得する場合は true'
        required: false
        default: 'false'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install pandas requests beautifulsoup4 huggingface_hub

      - name: データ更新スクリプトを実行
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.fetch_all }}" = "true" ]; then
            python update_data.py --all
          else
            WEEKS="${{ github.event.inputs.weeks_back }}"
            python update_data.py ${WEEKS:-1}
          fi

      - name: 更新データをコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add learning_data_perfect_tier.zip pedigree_master_all.csv || true
          git diff --staged --quiet || git commit -m "データ更新 $(date '+%Y-%m-%d')"
          git push
