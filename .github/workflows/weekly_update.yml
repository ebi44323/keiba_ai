name: keiba-ebye 週次データ更新

on:
  schedule:
    # 毎週水曜 AM6:00 JST（火曜 21:00 UTC）
    # ★2026-09-25: 火曜6:00 JST → 水曜6:00 JST に変更。
    #   祝日の火曜開催（例: 2026-09-22）があると、火曜朝の実行ではその日のレースを
    #   取り込めないまま次週まで持ち越されるため、開催ブロック(土日月火)が終わった
    #   翌朝に回す。update_data.py は直近1週間の全曜日を見るので取りこぼさない。
    - cron: '0 21 * * 2'
  workflow_dispatch:
    inputs:
      weeks_back:
        description: '何週分遡るか (デフォルト1)'
        required: false
        default: '1'
      fetch_all:
        description: 'ギャップ検出・全未取得データ取得する場合は true'
        required: false
        default: 'false'
      from_date:
        description: '指定日以降を全取得 (YYYYMMDD形式, 例: 20260523)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install pandas requests beautifulsoup4 huggingface_hub

      - name: データ更新スクリプトを実行
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FROM_DATE="${{ github.event.inputs.from_date }}"
          if [ -n "$FROM_DATE" ]; then
            python update_data.py --from "$FROM_DATE"
          elif [ "${{ github.event.inputs.fetch_all }}" = "true" ]; then
            python update_data.py --all
          else
            WEEKS="${{ github.event.inputs.weeks_back }}"
            python update_data.py ${WEEKS:-1}
          fi

      - name: 更新データをコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          # update_data.py が zip/pedigree を書き換えて作業ツリーが汚れているため、
          # 先にコミットしてツリーをクリーンにしてから rebase pull する。
          # （旧: 汚れたツリーで git pull --rebase → "cannot pull with rebase: unstaged changes" で失敗し
          #   originが分岐した7/25以降、毎週データ取得しても push できず捨てていた。2026-08-16修正）
          git add learning_data_perfect_tier.zip pedigree_master_all.csv || true
          git diff --staged --quiet || git commit -m "データ更新 $(date '+%Y-%m-%d')"
          # 念のため --autostash も付け、追跡外の想定外変更が残っても rebase を止めないようにする
          git pull --rebase --autostash origin main
          git push

      # ★2026-10-10: 馬ごとの過去走テーブル（前走・脚質・スピード指数）をモデルと切り離して更新する。
      #   これまでは再学習しない限り古いままで、再学習を止めている間に新しくデビューした2歳馬の
      #   脚質・スピード指数が空になっていた。モデル本体は変えない（再学習ではない）。
      #   推論側は HF Hub の horse_tables.pkl があればモデル内の表と差し替える。
      - name: 馬テーブルを作り直して HF Hub に置く（再学習ではない）
        env:
          HF_TOKEN:   ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          pip install --quiet \
            lightgbm==4.6.0 scikit-learn==1.8.0 pandas==2.3.3 numpy==2.4.2 \
            pytz==2026.1 huggingface_hub==1.7.2 joblib==1.5.3 streamlit==1.60.0
          python build_horse_tables.py
